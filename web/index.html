<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#131217" />
<title data-i18n>하이언니</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23825ED0'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='900' text-anchor='middle' fill='white' font-family='sans-serif' letter-spacing='-1'%3Ehi%3C/text%3E%3C/svg%3E" />
<!--
  HIUNNI web prototype, connected to the staging candidate API in ../backend.
  - Brand tokens per spec: background #131217, primary #825ED0.
  - Tabs per spec: 실시간현황 / 데일리톡 / 라운지 / 플레이스 / 마이페이지.
  - All content comes from the API (synthetic seed). Nothing falls back to mock data:
    API errors are shown as errors.
  - API base: same origin by default (served by `wrangler dev`), or ?api=http://host:port
-->
<style>
  :root {
    --bg: #131217;
    --surface: #1b1921;
    --surface-2: #24212d;
    --surface-3: #2d2938;
    --line: #322e3d;
    --primary: #825ED0;
    --primary-hover: #8f6edb;
    --primary-text: #b9a2f0;   /* primary for small text on dark (contrast) */
    --primary-soft: rgba(130, 94, 208, .16);
    --accent: #e87fa0;
    --text: #f3f1f8;
    --text-2: #a7a2b5;
    --text-3: #77728a;
    --ok: #5cc9a0;
    --warn: #e8b45c;
    --danger: #ec6f6f;
    --radius: 14px;
    --radius-sm: 10px;
    --top-h: 56px;
    --nav-h: 62px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  :focus-visible { outline: 2px solid var(--primary-text); outline-offset: 2px; }
  .hidden { display: none !important; }
  .lang-btn { min-width: 44px; font-size: 12px; letter-spacing: .2px; }
  .lang-corner { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; }
  .muted { color: var(--text-2); }
  .faint { color: var(--text-3); }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }
  .grow { flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { width: 20px; height: 20px; display: inline-block; flex-shrink: 0; }
  .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Buttons, chips, inputs ─────────────────────────── */
  .btn, .icon-btn, .chip, .tab, .account, .card.click, .menu-row, .cat, .fab, .tab-item {
    transition: transform .12s cubic-bezier(.22, 1, .36, 1), background .15s, border-color .15s, color .15s, opacity .15s;
  }
  :is(.btn, .icon-btn, .chip, .tab, .account, .card.click, .menu-row, .cat, .fab, .tab-item):active:not(:disabled) { transform: scale(.97); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; background: var(--surface-3); border: 1px solid var(--line); }
  .btn:hover:not(:disabled) { background: var(--line); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; padding: 14px; font-size: 15px; }
  .btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .icon-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--text-2); position: relative; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
  .badge.primary { background: var(--primary-soft); color: var(--primary-text); }
  .badge.accent { background: rgba(232,127,160,.16); color: var(--accent); }
  .badge.ok { background: rgba(92,201,160,.14); color: var(--ok); }
  .badge.warn { background: rgba(232,180,92,.14); color: var(--warn); }
  .badge.danger { background: rgba(236,111,111,.14); color: var(--danger); }
  .dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .field { width: 100%; padding: 11px 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); outline: none; transition: border-color .15s; }
  .field:focus { border-color: var(--primary); }
  .field::placeholder { color: var(--text-3); }
  textarea.field { resize: vertical; min-height: 90px; }
  label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; }
  .check input { accent-color: var(--primary); width: 16px; height: 16px; }
  .switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); flex-shrink: 0; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-2); transition: transform .15s, background .15s; }
  .switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: #fff; }

  /* ── Motion ─────────────────────────────────────────────
     Entry animations use fill-mode `backwards`, not `both`: a held final transform would
     override exit transitions (sheet, toast) and leave a permanent transform on the shell. */
  @keyframes introMarkIn { 0% { opacity: 0; transform: scale(.72); } 70% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes introDotPop { from { opacity: 0; transform: scale(0); } }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } }
  @keyframes screenEnter { from { opacity: 0; transform: translateY(8px); } }
  @keyframes itemStagger { from { opacity: 0; transform: translateY(10px); } }
  @keyframes sheetSlideUp { from { transform: translateY(100%); opacity: .6; } }
  @keyframes sheetDesktopPop { from { transform: translateY(20px) scale(.97); opacity: 0; } }
  @keyframes toastSlideIn { from { opacity: 0; transform: translateY(16px) scale(.96); } }
  .screen:not(.hidden), #shell:not(.hidden), #lock:not(.hidden) { animation: screenEnter 230ms cubic-bezier(.22, 1, .36, 1) backwards; }
  #intro:not(.hidden) .hi-mark { animation: introMarkIn 480ms cubic-bezier(.22, 1, .36, 1) backwards; }
  #intro:not(.hidden) .hi-dot { animation: introDotPop 260ms cubic-bezier(.34, 1.56, .64, 1) 240ms backwards; }
  #intro:not(.hidden) .intro-card > div:nth-child(2) { animation: fadeSlideUp 360ms cubic-bezier(.22, 1, .36, 1) 180ms backwards; }
  #intro:not(.hidden) #intro-start { animation: fadeSlideUp 360ms cubic-bezier(.22, 1, .36, 1) 300ms backwards; }
  #intro:not(.hidden) .age-note { animation: fadeSlideUp 360ms cubic-bezier(.22, 1, .36, 1) 390ms backwards; }

  /* ── Full-screen entry screens ──────────────────────── */
  .screen { position: fixed; inset: 0; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  #intro { background: radial-gradient(120% 80% at 50% 0%, #3b2370 0%, #1d1430 45%, var(--bg) 80%); }
  .intro-card { width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .hi-mark { position: relative; width: 148px; height: 148px; border-radius: 40px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #9a78e6 0%, var(--primary) 55%, #6a46b8 100%);
    box-shadow: 0 18px 50px rgba(130, 94, 208, .45), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .hi-word { font-size: 76px; font-weight: 900; letter-spacing: -4px; color: #fff; line-height: 1; transform: translateY(-4px); }
  .hi-dot { position: absolute; right: 26px; bottom: 30px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(255, 255, 255, .18); }
  .intro-title { font-size: 34px; font-weight: 900; letter-spacing: -.5px; }
  .intro-title span + span { color: var(--accent); }
  .intro-sub { color: var(--text-2); font-size: 15px; line-height: 1.7; }
  .age-note { font-size: 12px; color: var(--text-3); }
  #login { background: var(--bg); }
  .login-card { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 15px; letter-spacing: -1px; }
  .dev-banner { border: 1px dashed var(--warn); background: rgba(232,180,92,.07); color: var(--warn); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; line-height: 1.6; }
  .account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .account { text-align: left; padding: 12px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); }
  .account:hover:not(:disabled) { border-color: var(--primary); }
  .account b { display: block; font-size: 14px; }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
  .led.ok { background: var(--ok); } .led.bad { background: var(--danger); } .led.wait { background: var(--warn); }

  /* ── App shell ──────────────────────────────────────── */
  #shell { height: 100dvh; display: grid; grid-template-rows: calc(var(--top-h) + env(safe-area-inset-top)) minmax(0, 1fr) calc(var(--nav-h) + env(safe-area-inset-bottom)); grid-template-areas: "top" "main" "nav"; }
  .screen { padding-top: calc(24px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  /* App lock (native only): covers everything, also in the OS app switcher. */
  #lock { position: fixed; inset: 0; z-index: 500; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  #lock .hi-mark { width: 96px; height: 96px; border-radius: 26px; }
  #lock .hi-word { font-size: 48px; letter-spacing: -2px; }
  #lock .hi-dot { width: 12px; height: 12px; right: 17px; bottom: 20px; }
  .topbar { padding-top: env(safe-area-inset-top) !important; }
  .topbar { grid-area: top; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .mode-tag { font-size: 11px; font-weight: 700; color: var(--warn); border: 1px solid rgba(232,180,92,.4); border-radius: 999px; padding: 2px 8px; }
  main#main { grid-area: main; overflow-y: auto; overscroll-behavior: contain; }
  .tabs { grid-area: nav; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-3); position: relative; }
  .tab .icon { width: 22px; height: 22px; transition: transform .18s cubic-bezier(.22, 1, .36, 1); }
  .tab[aria-current="page"] { color: var(--primary-text); }
  .tab[aria-current="page"] .icon { transform: translateY(-1px); }
  .tab .dot { top: 6px; right: calc(50% - 22px); }
  .tab-label-long { display: none; }
  @media (min-width: 900px) {
    #shell { grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: var(--top-h) minmax(0, 1fr); grid-template-areas: "nav top" "nav main"; }
    .tabs { flex-direction: column; justify-content: flex-start; gap: 4px; padding: 72px 12px 12px; border-top: none; border-right: 1px solid var(--line); }
    .tab { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 15px; }
    .tab[aria-current="page"] { background: var(--primary-soft); }
    .tab .dot { position: static; margin-left: auto; }
    .tab-label-short { display: none; } .tab-label-long { display: inline; }
  }
  .view { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px; animation: screenEnter 220ms cubic-bezier(.22, 1, .36, 1) backwards; }
  .view.fill { height: 100%; padding-bottom: 0; gap: 10px; }
  .view-head { display: flex; align-items: center; gap: 6px; }
  .view-title { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
  .view-sub { font-size: 13px; color: var(--text-2); margin-top: -8px; }
  .back { margin-left: -8px; }
  .section-label { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .card.click { cursor: pointer; text-align: left; width: 100%; display: block; }
  .card.click:hover { border-color: #4a4359; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  /* Staggered entrance; .skeleton below keeps its own shimmer (same specificity, later rule). */
  .list > *, .account-grid > *, .msgs > .msg, .comment { animation: itemStagger 260ms cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(min(var(--i, 0), 10) * 32ms); }
  .list > *:nth-child(2), .account-grid > *:nth-child(2), .comment:nth-child(2) { --i: 1; }
  .list > *:nth-child(3), .account-grid > *:nth-child(3), .comment:nth-child(3) { --i: 2; }
  .list > *:nth-child(4), .account-grid > *:nth-child(4), .comment:nth-child(4) { --i: 3; }
  .list > *:nth-child(5), .account-grid > *:nth-child(5), .comment:nth-child(5) { --i: 4; }
  .list > *:nth-child(6), .account-grid > *:nth-child(6), .comment:nth-child(6) { --i: 5; }
  .list > *:nth-child(7), .account-grid > *:nth-child(7), .comment:nth-child(7) { --i: 6; }
  .list > *:nth-child(8), .account-grid > *:nth-child(8), .comment:nth-child(8) { --i: 7; }
  .list > *:nth-child(9), .account-grid > *:nth-child(9), .comment:nth-child(9) { --i: 8; }
  .list > *:nth-child(n+10), .account-grid > *:nth-child(n+10), .comment:nth-child(n+10) { --i: 9; }
  .empty { text-align: center; padding: 36px 16px; color: var(--text-3); font-size: 14px; animation: fadeSlideUp 240ms ease backwards; }
  .error-box { border: 1px solid rgba(236,111,111,.4); background: rgba(236,111,111,.08); color: var(--danger); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .skeleton { height: 76px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  .search input { flex: 1; background: none; border: none; outline: none; padding: 11px 0; min-width: 0; }
  .search .icon { color: var(--text-3); width: 18px; height: 18px; }
  .menu-row { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .menu-row:last-child { border-bottom: none; }
  .menu-row .icon { color: var(--primary-text); }

  /* ── Rooms / live status ─────────────────────────────── */
  .room-card { padding: 14px 14px 12px 16px; }
  .room-head { display: flex; align-items: flex-start; gap: 6px; }
  .room-head .icon-btn { width: 44px; height: 44px; margin: -8px -8px 0 0; flex-shrink: 0; }
  /* Long Korean venue names: break between words, never mid-word, up to two lines. */
  .venue-name { font-weight: 800; font-size: 17px; line-height: 1.35; letter-spacing: -.2px; word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .room-meta { margin-top: 3px; font-size: 13px; color: var(--text-2); }
  .room-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; min-height: 22px; }
  .fresh { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
  .fresh::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .fresh.now { color: var(--ok); }
  .fresh.now::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(92,201,160,.18); }

  /* Live counts: loading / none (not reported) / ok (0 is a real value) / error + retry */
  .stats { margin-top: 10px; }
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; text-align: center; transition: opacity .2s; }
  .stat b { display: block; height: 26px; font-size: 20px; line-height: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--text-2); }
  .stat.zero b { color: var(--text-2); }
  .stat.unset b { color: var(--text-3); font-weight: 600; }
  .stat.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { background: var(--primary); } }
  .stats[data-state="loading"] .stat b { color: transparent; width: 30px; margin: 0 auto; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3) 0%, #3b3549 50%, var(--surface-3) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  .stats[data-state="error"] .stats4 { opacity: .4; }
  .stats[data-state="none"] .stats4 { display: none; }
  .stat-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--text-2); }
  .stat-note:empty { display: none; }
  .stats[data-state="none"] .stat-note { margin-top: 0; padding: 12px; border-radius: 10px; background: var(--surface-2); }
  .stats[data-state="error"] .stat-note { color: #ffb3b3; }
  .stat-note .btn { min-height: 40px; flex-shrink: 0; }

  .room-layout { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view-title.clamp2, .clamp2 { word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .tool-bar { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
  .tool-bar .btn { min-height: 46px; padding: 6px 4px; font-size: 13px; word-break: keep-all; }
  .tool-bar .btn.primary { font-size: 14px; }
  .tool-bar .btn .icon { width: 18px; height: 18px; }

  /* Search: clear button, sticky on lists, no-results reset */
  .search .clear { width: 36px; height: 36px; margin-right: -8px; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search input { min-height: 44px; }
  .sticky-search { position: sticky; top: 0; z-index: 4; background: var(--bg); margin: -8px -16px; padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .empty-reset { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 32px 16px; color: var(--text-2); font-size: 14px; word-break: keep-all; }
  .empty-reset .btn { min-height: 44px; padding-left: 20px; padding-right: 20px; }
  .staff-card { display: flex; align-items: center; gap: 12px; }
  .staff-card .btn { min-height: 44px; flex-shrink: 0; }
  .staff-name { word-break: keep-all; overflow-wrap: anywhere; }

  /* Home */
  .home-hero { display: flex; flex-direction: column; align-items: stretch; width: 100%; text-align: left; border-radius: 18px; padding: 18px; background: linear-gradient(145deg, #9a78e6 0%, var(--primary) 52%, #5b3aa6 100%); color: #fff; box-shadow: 0 10px 30px rgba(130,94,208,.35); }
  .home-hero .kicker { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; opacity: .9; }

/** t('참여 {n}명', { n: 3 }) — Korean source text is the key; missing entries fall back to Korean. */
function t(ko, vars) {
  let out = LANG === 'en' ? (EN[ko] ?? ko) : ko;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return out;
}
/** Fixed Korean notification text written by the server. */
function trServer(text) {
  if (LANG !== 'en' || !text) return text;
  if (EN[text]) return EN[text];
  let m = /^찜한 가게 현황: (.+)$/.exec(text);
  if (m) return 'Saved store update: ' + m[1];
  m = /^대기 (\S+) · 빈방 (\S+)$/.exec(text);
  if (m) return `Waiting ${m[1]} · Vacant ${m[2]}`;
  return text;
}
const STATIC_HTML_EN = {
  introSub: 'Talk freely and anonymously.<br>Live store status and stories in one place.',

};
function setLang(lang) {
  try { localStorage.setItem('hiunni.lang', lang); } catch {}
  location.reload();
}
function applyStaticI18n() {
  document.documentElement.lang = LANG;
  for (const b of document.querySelectorAll('[data-lang-toggle]')) {
    b.textContent = LANG === 'en' ? '한국어' : 'EN';
    b.setAttribute('aria-label', LANG === 'en' ? '한국어로 보기' : 'View in English');
    b.onclick = () => setLang(LANG === 'en' ? 'ko' : 'en');
  }
  if (LANG !== 'en') return;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.textContent.trim());
  for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.getAttribute('aria-label')));
  for (const el of document.querySelectorAll('[data-i18n-title]')) el.setAttribute('title', t(el.getAttribute('title')));
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = STATIC_HTML_EN[el.dataset.i18nHtml]; // trusted constants
}
applyStaticI18n();

// instead of rendering the text "false". Scoped to this page's own script.
for (const name of ['append', 'replaceChildren']) {
  const native = Element.prototype[name];
  Element.prototype[name] = function (...kids) {
    return native.apply(this, kids.filter(k => k != null && k !== false));
  };
}

/** Safe DOM builder: strings are always text nodes (no innerHTML for data). */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

async function api(method, path, body, opts = {}) {
  const epoch = S.epoch;
  const headers = {};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  let payload;
  if (opts.raw) { payload = opts.raw; headers['Content-Type'] = opts.contentType; }
  else if (body !== undefined) { payload = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
  let res;
  try {
    res = await fetch(API + path, { method, headers, body: payload });
  } catch {
    if (epoch !== S.epoch) throw new Stale();
    throw new ApiError(0, 'network');
  }
  if (epoch !== S.epoch) throw new Stale(); // response belongs to a previous session
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && S.token && !opts.noAuthRedirect) {
    endSession(t('세션이 만료되었어요. 다시 로그인해 주세요.'));
    throw new Stale();
  }
  if (!res.ok) throw new ApiError(res.status, data?.error?.code || 'http_' + res.status, data?.error?.message);
  return data;
}

/* ════════════════════════════════════════════════════════════════════
   Realtime (WebSocket via single-use ticket, auto-reconnect)
   ════════════════════════════════════════════════════════════════════ */
class Live {
  constructor(channel, { onEvent, onReady, onState } = {}) {
    Object.assign(this, { channel, onEvent: onEvent || (() => {}), onReady, onState, retry: 0, closed: false, epoch: S.epoch });
    this.connect();
  }
  async connect() {
    if (this.closed || this.epoch !== S.epoch) return;
    this.onState?.('connecting');
    let ticketRes;
    try {
      ticketRes = await api('POST', '/realtime/tickets', { channel: this.channel });
    } catch (e) {
      if (e instanceof Stale || this.closed) return;
      if (e.status === 403) { this.closed = true; this.onEvent({ type: 'revoked', reason: e.code }); return; }
      return this.schedule();
    }
    if (this.closed) return;
    const ws = new WebSocket(API.replace(/^http/, 'ws') + '/realtime/ws?ticket=' + encodeURIComponent(ticketRes.ticket));
    this.ws = ws;
    ws.onmessage = e => {
      if (e.data === 'pong') return;
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }
      if (ev.type === 'ready') { this.retry = 0; this.onState?.('live'); this.onReady?.(); return; }
      if (ev.type === 'revoked') this.closed = true;
      this.onEvent(ev);
    };
    ws.onclose = e => {
      clearInterval(this.ping);
      if (this.closed) { this.onState?.('closed'); return; }
      if (e.code === 4003) { this.closed = true; this.onEvent({ type: 'revoked', reason: e.reason }); return; }
      this.onState?.('reconnecting');
      this.schedule();
    };
    this.ping = setInterval(() => ws.readyState === 1 && ws.send('ping'), 25000);
  }
  schedule() {
    const delay = Math.min(10000, 1000 * 2 ** this.retry++);
    this.timer = setTimeout(() => this.connect(), delay);
  }
  close() {
    this.closed = true;
    clearTimeout(this.timer);
    clearInterval(this.ping);
    try { this.ws?.close(1000); } catch {}
  }
}

/** Animates out unless `animate === false` (used when one sheet replaces another).
    Click handlers pass an Event here, which counts as animate. */
function closeSheet(animate) {
  const back = $('#sheet-root .sheet-back:not(.closing)');
  if (back) {
    document.removeEventListener('keydown', back._onKey);
    if (animate === false) back.remove();
    else { back.classList.add('closing'); setTimeout(() => back.remove(), 190); }
  }
  const fn = sheetCleanup; sheetCleanup = null; fn?.();
}

/** Paged list helper with "더 보기". fetchPage(cursor) → { items, nextCursor } */
function pagedList({ fetchPage, renderItem, emptyText }) {
  const listEl = h('div', { class: 'list' });
  const moreBtn = h('button', { class: 'btn block hidden', onclick: () => load(false) }, t('더 보기'));
  const wrap = h('div', { class: 'stack' }, listEl, moreBtn);
  let cursor = null, token = 0;
  async function load(reset) {
    const my = reset ? ++token : token;
    if (reset) { cursor = null; listEl.replaceChildren(skeletons()); moreBtn.classList.add('hidden'); }
    moreBtn.disabled = true;
    try {
      const page = await fetchPage(cursor);
      if (my !== token) return;
      if (reset) listEl.replaceChildren();
      page.items.forEach(it => listEl.append(renderItem(it)));
      if (reset && !page.items.length) {
        const e = typeof emptyText === 'function' ? emptyText() : emptyText;
        listEl.append(e instanceof Node ? e : empty(e));
      }
      cursor = page.nextCursor;
      moreBtn.classList.toggle('hidden', !cursor);
    } catch (e) {
      if (e instanceof Stale || my !== token) return;
      if (reset) listEl.replaceChildren(errorBox(e, () => load(true)));
      else toast(errText(e), 'error');
    }
    moreBtn.disabled = false;
  }
  return { el: wrap, reload: () => load(true), listEl };
}

  $('#bell').replaceChildren(icon('bell'), unread > 0 && h('span', { class: 'dot' }, unread > 99 ? '99+' : unread));
}

function clearStack() {
  for (const v of S.stack) v.cleanup?.();
  S.stack = [];
}
function mount(view) {
  const main = $('#main');
  main.replaceChildren(view.el);
  main.scrollTop = 0;
}
function switchTab(id) {
  clearStack();
  closeSheet();
  S.tab = id;
  drawTabs();
  const view = TABS.find(tab => tab[0] === id)[4]();
  S.stack.push(view);
  mount(view);
}
/** Push a detail view on the current tab's stack. */
function push(view) {
  const prev = S.stack[S.stack.length - 1];
  if (prev) prev.scrollTop = $('#main').scrollTop; // so back() lands on the same list position
  prev?.pause?.();
  S.stack.push(view);
  mount(view);
}
function back() {
  if (S.stack.length <= 1) return;
  S.stack.pop().cleanup?.();
  const top = S.stack[S.stack.length - 1];
  top.el.classList.add('returning');
  mount(top);
  $('#main').scrollTop = top.scrollTop || 0;

/* ════════════════════════════════════════════════════════════════════
   Media (F02): upload + short-lived signed URLs
   ════════════════════════════════════════════════════════════════════ */
async function mediaUrl(id) {
  const hit = S.mediaUrls.get(id);
  if (hit && hit.exp - Date.now() > 30000) return hit.url;
  const r = await api('GET', `/media/${id}/url`);
  S.mediaUrls.set(id, { url: r.url, exp: Date.parse(r.expiresAt) });
  return r.url;
}
function mediaImg(id) {
  const ph = h('div', { class: 'img-ph' }, t('사진 불러오는 중…'));
  mediaUrl(id)
    .then(url => ph.replaceWith(h('img', { src: url, alt: t('첨부 사진'), loading: 'lazy' })))
    .catch(e => { if (!(e instanceof Stale)) ph.textContent = e.status === 403 ? t('볼 수 없는 사진') : t('사진을 불러오지 못했어요'); });
  return ph;
}
function pickImage() {
  return new Promise(resolve => {
    const input = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', class: 'hidden' });
    input.addEventListener('change', () => { resolve(input.files[0] || null); input.remove(); });
    document.body.append(input);
    input.click();
  });
}
async function uploadImage(file) {
  if (file.size > 10 * 1024 * 1024) throw new ApiError(413, 'too_large');
  return api('POST', '/media', undefined, { raw: file, contentType: file.type });
}

/* ════════════════════════════════════════════════════════════════════
   Chat component (rooms + DM): pending/sending/failed/retry, dedupe, backfill
   ════════════════════════════════════════════════════════════════════ */
function createChat({ showNick, send, meId = S.user.id, emptyText = t('첫 메시지를 남겨보세요.') }) {
  const list = h('div', { class: 'msgs', 'aria-live': 'polite' });
  const byId = new Map();          // message id → element
  const pending = new Map();       // localId → { requestId, body, mediaId, el, state }
  let lastSeq = 0, ownReadSeq = 0, disabled = false;
  const emptyEl = empty(emptyText);
  list.append(emptyEl);

  const input = h('textarea', { rows: 1, placeholder: t('메시지를 입력하세요'), maxlength: 2000, 'aria-label': t('메시지 입력') });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(120, input.scrollHeight) + 'px'; });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitText(); }
  });
  const photoBtn = h('button', { class: 'icon-btn', 'aria-label': t('사진 보내기'), onclick: submitPhoto }, icon('image'));
  const sendBtn = h('button', { class: 'btn primary', style: 'height:42px', 'aria-label': t('전송'), onclick: submitText }, icon('send'));
  const composer = h('div', { class: 'composer' }, photoBtn, input, sendBtn);
  const blockedBar = h('div', { class: 'chat-blocked hidden' });
  const el = h('div', { class: 'chat' }, list, composer, blockedBar);

  const nearBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  const scrollDown = () => requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; });

  function bubble(m) {
    return h('div', { class: 'bubble' }, m.mediaId && mediaImg(m.mediaId), m.body && (m.mediaId ? h('div', { style: 'margin-top:10px' }, m.body) : m.body));
  }
  function renderMsg(m) {
    const mine = m.senderId === meId;
    const readEl = mine && h('span', { class: 'read' }, m.readByOther || m.seq <= ownReadSeq ? t('읽음') : '');
    const node = h('div', { class: 'msg' + (mine ? ' mine' : '') },
      showNick && !mine && h('span', { class: 'who' }, m.senderNickname || t('익명')),
      bubble(m),
      h('span', { class: 'meta' }, readEl, clock(m.createdAt)));
    node.dataset.seq = m.seq;
    node.dataset.mine = mine ? '1' : '';
    return node;
  }
  function insertSorted(node, seq) {
    emptyEl.remove();
    const firstPending = [...list.children].find(c => c.dataset.pending);
    let before = firstPending || null;
    for (const c of list.children) {
      if (c.dataset.pending) break;
      if (Number(c.dataset.seq) > seq) { before = c; break; }
    }
    list.insertBefore(node, before);
  }
  function add(m) {
    if (byId.has(m.id)) return;
    // Our own message may arrive over the socket before the HTTP response: merge with the pending bubble.
    if (m.senderId === meId) {
      for (const [lid, p] of pending) {
        if (p.state === 'sending' && (p.body ?? null) === (m.body ?? null) && (p.mediaId ?? null) === (m.mediaId ?? null)) {
          p.el.remove(); pending.delete(lid); break;
        }
      }
    }
    const stick = nearBottom() || m.senderId === meId;
    const node = renderMsg(m);
    byId.set(m.id, node);
    insertSorted(node, m.seq);
    lastSeq = Math.max(lastSeq, m.seq);
    if (stick) scrollDown();
  }
  function renderPending(lid) {
    const p = pending.get(lid);
    const meta = p.state === 'failed'
      ? h('span', { class: 'meta', style: 'color:var(--danger)' }, t('전송 실패 · '), h('button', { class: 'btn sm', onclick: () => doSend(lid) }, t('다시 보내기')), h('button', { class: 'btn sm', onclick: () => { p.el.remove(); pending.delete(lid); } }, t('삭제')))
      : h('span', { class: 'meta' }, t('전송 중…'));
    const node = h('div', { class: 'msg mine ' + p.state }, bubble({ body: p.body, mediaId: p.mediaId }), meta);
    node.dataset.pending = '1';
    if (p.el) p.el.replaceWith(node); else { emptyEl.remove(); list.append(node); }
    p.el = node;
  }
  async function doSend(lid) {
    const p = pending.get(lid);
    if (!p) return;
    p.state = 'sending';
    renderPending(lid);
    scrollDown();
    try {
      // Same requestId on every retry → the server stores the message once.
      const r = await send({ requestId: p.requestId, body: p.body, mediaId: p.mediaId });
      if (!pending.has(lid)) { add(r.message); return; }
      p.el.remove(); pending.delete(lid);
      add(r.message);
    } catch (e) {
      if (e instanceof Stale || !pending.has(lid)) return;
      if (e.status === 403 || e.code === 'room_closed') { p.el.remove(); pending.delete(lid); toast(errText(e), 'error'); return; }
      p.state = 'failed';
      renderPending(lid);
    }
  }
  function queue(body, mediaId) {
    const lid = newKey();
    pending.set(lid, { requestId: newKey(), body, mediaId, state: 'sending', el: null });
    doSend(lid);
  }
  function submitText() {
    if (disabled) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';  // draft is separate from the in-flight payload
    queue(text, undefined);
    input.focus();
  }
  async function submitPhoto() {
    if (disabled) return;
    const file = await pickImage();
    if (!file) return;
    photoBtn.disabled = true;
    try {
      toast(t('사진 업로드 중…'));
      const m = await uploadImage(file);
      queue(undefined, m.id);
    } catch (e) { if (!(e instanceof Stale)) toast(errText(e), 'error'); }
    photoBtn.disabled = false;
  }
  return {
    el, add,
    get lastSeq() { return lastSeq; },
    load(items) { items.forEach(add); scrollDown(); },
    markOwnRead(seq) {
      ownReadSeq = Math.max(ownReadSeq, seq);
      for (const node of byId.values()) if (node.dataset.mine && Number(node.dataset.seq) <= ownReadSeq) { const r = node.querySelector('.read'); if (r) r.textContent = t('읽음'); }
    },
    /** Permission revoked: clear history and draft, stop input. */
    revoke(text) {
      disabled = true;
      byId.clear(); pending.clear();
      list.replaceChildren(empty(text));
      input.value = '';
      composer.classList.add('hidden');
      blockedBar.textContent = text;
      blockedBar.classList.remove('hidden');
    },
    disable(text) {
      disabled = true;
      composer.classList.add('hidden');
      blockedBar.textContent = text;
      blockedBar.classList.remove('hidden');
    },
  };
}

/* ════════════════════════════════════════════════════════════════════
   담당 찾기 — staff search for one store room (F08)
   Back returns to the same room; back again to the same list position.
   ════════════════════════════════════════════════════════════════════ */
const STAFF_RANK = ['실장', '부실장', '부장', '팀장', '담당'];
function viewStaff(room) {
  const f = { q: '', title: '' };
  let staff = null;
  const search = searchBox({ placeholder: t('이름이나 직함으로 찾기'), label: t('담당 검색'), onChange: q => { f.q = q; draw(); } });
  const titleWrap = h('div');
  let titleChips = null;
  const countEl = h('div', { class: 'section-label', 'aria-live': 'polite' });
  const listEl = h('div', { class: 'list' }, skeletons(3));

  function reset() { f.q = ''; f.title = ''; search.set(''); titleChips?.set(''); draw(); }
  function lastSeen(s) {
    if (!s.lastSeen.visible) return t('최근 접속 비공개');
    return s.lastSeen.at ? t('최근 접속 {t}', { t: ago(s.lastSeen.at) }) : t('접속 기록 없음');
  }

      h('div', { class: 'avatar sm' }, initial),
      h('div', { class: 'grow', style: 'min-width:0' },
        h('div', { class: 'row', style: 'gap:6px;flex-wrap:wrap' }, h('b', { class: 'staff-name' }, s.nickname), h('span', { class: 'badge primary' }, s.title)),
        h('div', { class: 'small faint', style: 'margin-top:2px' }, lastSeen(s))),
      s.userId !== S.user.id && h('button', { class: 'btn', onclick: () => dmRequestSheet({ toUserId: s.userId }, s.nickname) }, t('1:1 신청')));
  }
  function draw() {
    if (!staff) return;
    const q = f.q.toLowerCase();

    countEl.textContent = staff.length ? t('담당 {n}명', { n: hits.length }) : '';

/* ════════════════════════════════════════════════════════════════════
   실시간현황 / 데일리톡 — rooms (F03, F07, F08)
   ════════════════════════════════════════════════════════════════════ */
/**
 * Live counts with four distinct states:
 *  loading — shimmer, no numbers yet
 *  none    — the store has not reported anything ("아직 등록된 현황이 없어요")
 *  ok      — numbers; a confirmed 0 shows as "0", a single unreported field as "—"
 *  error   — last values dimmed, with a retry button
 * Pass `undefined` to start in loading, `null` for "not reported".
 */
function statsBlock(st) {
  const cells = [['choice', t('초중')], ['entry', t('엔트리')], ['waiting', t('대기')], ['vacancy', t('빈방')]];
  const grid = h('div', { class: 'stats4' }, cells.map(([k, label]) => h('div', { class: 'stat', 'data-k': k }, h('b', null, ''), h('span', null, label))));
  const note = h('div', { class: 'stat-note', role: 'status' });
  const el = h('div', { class: 'stats' }, grid, note);
  let current = null;
  const setState = s => { el.dataset.state = s; el.setAttribute('aria-busy', String(s === 'loading')); };
  function paint(next, flash) {
    for (const [k, label] of cells) {
      const cell = grid.querySelector(`[data-k="${k}"]`);
      const b = cell.firstChild;
      const n = next?.[k];
      const v = numOrDash(n);
      cell.classList.toggle('zero', n === 0);
      cell.classList.toggle('unset', n == null);
      cell.setAttribute('aria-label', `${label} ${n == null ? t('미등록') : n}`);
      if (b.textContent !== v) {
        b.textContent = v;
        if (flash) { cell.classList.remove('flash'); void cell.offsetWidth; cell.classList.add('flash'); }
      }
    }
  }
  const block = {
    el,
    update(next, flash = true) {
      const wasOk = el.dataset.state === 'ok';
      current = next || null;
      if (!next) { setState('none'); note.replaceChildren(t('아직 등록된 현황이 없어요.')); paint(null, false); return; }
      setState('ok');
      note.replaceChildren();
      paint(next, flash && wasOk);
    },
    loading() { setState('loading'); note.replaceChildren(); },
    fail(retry) {
      setState('error');
      note.replaceChildren(
        h('span', null, current ? t('업데이트 실패 · 마지막으로 받은 숫자예요.') : t('현황을 불러오지 못했어요.')),
        retry && h('button', { class: 'btn sm', onclick: e => { e.stopPropagation(); retry(); } }, t('다시 시도')));
    },
    get failed() { return el.dataset.state === 'error'; },
  };
  if (st === undefined) block.loading(); else block.update(st, false);
  return block;
}
/** "3분 전 업데이트", green while fresh (under 15 minutes). */
function freshTag(st) {
  if (!st) return h('span', { class: 'fresh' }, t('현황 미등록'));
  const fresh = Date.now() - Date.parse(st.updatedAt) < 15 * 60000;
  return h('span', { class: 'fresh' + (fresh ? ' now' : '') }, t('{t} 업데이트', { t: ago(st.updatedAt) }));
}
/** Search box with a clear button. Enter runs the search and closes the phone keyboard. */
function searchBox({ placeholder, label, onChange, onSubmit }) {
  const input = h('input', { type: 'search', enterkeyhint: 'search', autocomplete: 'off', placeholder, 'aria-label': label });
  const clear = h('button', { class: 'icon-btn clear hidden', type: 'button', 'aria-label': t('검색어 지우기'), onclick: () => { set(''); onChange(''); input.focus(); } }, icon('x'));
  const set = v => { input.value = v; clear.classList.toggle('hidden', !v); };
  input.addEventListener('input', () => { clear.classList.toggle('hidden', !input.value); onChange(input.value.trim()); });
  input.addEventListener('keydown', e => {

  });

}
/** Empty result with a way out: shown when a search or filter finds nothing. */
const resetEmpty = (text, label, onReset) =>

const stateBadge = s => { const [t, c] = MEMBER_STATE[s] || MEMBER_STATE.none; return h('span', { class: 'badge ' + c }, t); };

function viewRooms(mode) {
  const isDaily = mode === 'daily';

    resume: () => { startLive(); refreshCounts(); },
  };
}

/* ════════════════════════════════════════════════════════════════════
   Native app (Capacitor) — 의뢰서 ⑥ app lock + app links, ⑤ push.
   Everything here is inert in a normal browser (window.HiunniNative is only in app builds).
   ════════════════════════════════════════════════════════════════════ */
const NATIVE = window.HiunniNative?.isNative ? window.HiunniNative : null;
// The app keeps the session across launches (protected by the app lock and excluded from backups);
// the browser keeps it for the tab only.
const sessionStore = (() => { try { return NATIVE ? localStorage : sessionStorage; } catch { return null; } })();
const LOCK_KEY = 'hiunni.applock';
const LOCK_GRACE_MS = 30000; // back within 30 s → no new prompt
let pendingLink = null, unlocking = false, unlockedAt = 0, backgroundedAt = 0, pushListenersReady = false;
ERROR_TEXT.lock_unavailable = t('이 기기에서는 잠금을 쓸 수 없어요. 휴대폰 화면 잠금(지문·Face ID·비밀번호)을 먼저 설정해 주세요.');
ERROR_TEXT.lock_cancelled = t('인증이 취소되었어요.');

const lockEnabled = () => { try { return localStorage.getItem(LOCK_KEY) === '1'; } catch { return false; } };

async function biometricAvailable() {
  try { return !!(await NATIVE.NativeBiometric.isAvailable({ useFallback: true })).isAvailable; } catch { return false; }
}
async function verifyUser(reason) {
  try {
    await NATIVE.NativeBiometric.verifyIdentity({
      reason, title: t('하이언니'), subtitle: reason,
      useFallback: true, fallbackTitle: t('비밀번호 사용'), // iOS: device passcode fallback
      // Android: fingerprint, face, iris, or the phone's PIN/pattern/password
      ...(NATIVE.platform === 'android' ? { allowedBiometryTypes: [3, 4, 5, 7] } : {}),
    });
  } catch { throw new ApiError(0, 'lock_cancelled'); }
}
async function unlock() {
  if (unlocking) return;
  unlocking = true;
  try { await verifyUser(t('앱 잠금 해제')); unlockedAt = Date.now(); $('#lock').classList.add('hidden'); }
  catch { /* stays locked; the button retries */ }
  unlocking = false;
}

/** Route an app link / notification link: https://hiunni.kr/posts/<id>, hiunni://rooms/<id>, /dm/<id> … */
async function openLink(raw) {
  if (!raw) return;
  let path;
  try {
    const u = new URL(raw, 'https://hiunni.kr');
    path = u.protocol === 'hiunni:' ? '/' + u.host + u.pathname : u.pathname;
  } catch { return; }
  if (!S.token) { pendingLink = path; return; } // opened after login
  const m = path.match(/^\/(rooms|posts|dm|places)\/(?:(requests)\/)?([A-Za-z0-9_-]{1,64})\/?$/);
  if (!m) return;
  const [, kind, sub, id] = m;
  closeSheet();
  if (kind === 'rooms') { switchTab('live'); push(viewRoom(id)); }
  else if (kind === 'posts') { switchTab('lounge'); push(viewPost(id)); }
  else if (kind === 'places') { switchTab('places'); placeSheet(id, todayKst()); }
  else if (sub) { switchTab('my'); push(viewRequests()); }
  else {
    switchTab('my');
    let other = null;
    try { other = (await api('GET', '/dm/conversations')).items.find(c => c.id === id)?.other; } catch {}
    push(other ? viewDm(id, other) : viewConversations());
  }
}

async function registerPush() {
  // Off until Firebase (google-services.json) and APNs are configured: HIUNNI_PUSH=1 at build time.
  if (!NATIVE || !window.HIUNNI_CONFIG?.push) return;
  const P = NATIVE.PushNotifications;
  if (!pushListenersReady) {
    pushListenersReady = true;
    P.addListener('registration', reg => { if (S.token) api('PUT', '/push/devices', { platform: NATIVE.platform, token: reg.value }).catch(() => {}); });
    P.addListener('registrationError', () => toast(t('푸시 알림을 켜지 못했어요.'), 'error'));
    P.addListener('pushNotificationReceived', () => refreshCounts());
    P.addListener('pushNotificationActionPerformed', a => openLink(a.notification?.data?.link));
  }
  try {
    let perm = await P.checkPermissions();
    if (perm.receive === 'prompt' || perm.receive === 'prompt-with-rationale') perm = await P.requestPermissions();
    if (perm.receive === 'granted') await P.register();
  } catch {}
}

async function initNative() {
  if (!NATIVE) return;
  try { await NATIVE.StatusBar.setStyle({ style: NATIVE.StatusBarStyle.Dark }); } catch {}
  if (NATIVE.platform === 'android') { try { await NATIVE.StatusBar.setBackgroundColor({ color: '#131217' }); } catch {} }
  NATIVE.App.addListener('appUrlOpen', e => openLink(e.url));
  NATIVE.App.addListener('backButton', () => {
    if ($('#sheet-root .sheet-back:not(.closing)')) return closeSheet();
    if (!$('#shell').classList.contains('hidden')) {
      if (S.stack.length > 1) return back();
      if (S.tab !== 'home') return switchTab('home');
    } else if (!$('#login').classList.contains('hidden')) return show('intro');
    NATIVE.App.minimizeApp();
  });
  NATIVE.App.addListener('appStateChange', ({ isActive }) => {
    if (!lockEnabled()) return;
    if (!isActive) {
      // Cover the content right away so it never shows in the app switcher.
      if (!unlocking) { backgroundedAt = Date.now(); $('#lock').classList.remove('hidden'); }
      return;
    }
    if (unlocking) return; // the biometric prompt itself makes iOS briefly inactive
    const graceOk = unlockedAt > 0 && backgroundedAt > 0 && Date.now() - backgroundedAt < LOCK_GRACE_MS;
    if (graceOk) $('#lock').classList.add('hidden');
    else { unlockedAt = 0; unlock(); }
  });
  $('#unlock-btn').addEventListener('click', unlock);
  if (lockEnabled()) { $('#lock').classList.remove('hidden'); unlock(); }
  try { await NATIVE.SplashScreen.hide(); } catch {}
}

  return h('div', { class: 'menu-row' }, icon('lock'),
    h('span', { class: 'grow' }, t('앱 잠금'), h('div', { class: 'faint small' }, t('Face ID·지문·휴대폰 비밀번호로 앱을 잠가요.'))),
    switchBtn(lockEnabled(), async on => {
      if (on) {
        if (!(await biometricAvailable())) throw new ApiError(0, 'lock_unavailable');
        await verifyUser(t('앱 잠금 켜기'));
        unlockedAt = Date.now();
      }
      localStorage.setItem(LOCK_KEY, on ? '1' : '0');
      toast(on ? t('앱 잠금을 켰어요.') : t('앱 잠금을 껐어요.'), 'ok');
    }, t('앱 잠금')));
}

let countsTimer = null;
function startSession(token, user) {
  S.epoch++;
  S.token = token; S.user = user;
  try { sessionStore?.setItem('hiunni.session', JSON.stringify({ token, user })); } catch {}
  show('shell');
  switchTab('home');
  refreshCounts();
  clearInterval(countsTimer);
  countsTimer = setInterval(refreshCounts, 20000);
  registerPush();
  if (pendingLink) { const p = pendingLink; pendingLink = null; openLink(p); }
}

async function refreshCounts() {
  try { const me = await api('GET', '/me'); S.counts = me.counts; drawTabs(); } catch {}
}

/** Clear all session state. Late responses from the old session are dropped via S.epoch. */
function endSession(message) {
  S.epoch++;
  clearStack();
  closeSheet();
  clearInterval(countsTimer);
  S.token = null; S.user = null; S.counts = null; S.mediaUrls.clear();
  pendingLink = null;
  try { sessionStore?.removeItem('hiunni.session'); } catch {}
  $('#main').replaceChildren();
  show('intro');
  if (message) toast(message);
}

async function logout() {
  try { await api('POST', '/auth/logout'); } catch {}
  endSession(t('로그아웃했어요.'));
}

$('#intro-start').addEventListener('click', showLogin);
$('#login-back').addEventListener('click', () => show('intro'));
$('#bell').addEventListener('click', () => { if (S.tab !== 'my') switchTab('my'); push(viewNotifications()); });

(async function boot() {
  await initNative();
  let saved = null;
  try { saved = JSON.parse(sessionStore?.getItem('hiunni.session') || 'null'); } catch {}
  if (saved?.token) {
    S.token = saved.token;
    try {
      const me = await api('GET', '/me', undefined, { noAuthRedirect: true });
      startSession(saved.token, { id: me.id, nickname: me.nickname, role: me.role });
      return;
    } catch (e) {
      S.token = null;
      // Only forget the session if the server rejected it, not when the network is down.
      if (e.status === 401) { try { sessionStore?.removeItem('hiunni.session'); } catch {} }
      else if (saved?.token) toast(t('서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.'), 'error');
    }
  }
  show('intro');
})();
</script>

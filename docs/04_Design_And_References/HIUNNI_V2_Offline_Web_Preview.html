/* HIUNNI UI refinement v2: preserve existing behavior and source layout. */
:root{--bg:#131217;--bg2:#18151e;--panel:#24212d;--panel2:#2b2633;--stroke:#40374b;--primary:#825ed0;--lavender:#bb98f3;--muted:#b9b1c4;--radius:21px}
html{scroll-behavior:smooth}button, a, input, textarea{touch-action:manipulation}
body{background:radial-gradient(circle at 75% -320px,#34244f55,transparent 670px),var(--bg)}
main{padding-bottom:110px}
.card,.place-card,.room-card,.post-board,.form-panel,.menu-row{box-shadow:0 6px 30px rgba(5,2,12,.10)}
.hero{border-radius:28px;background:radial-gradient(circle at 88% 0%,#e2a7e04a,transparent 45%),radial-gradient(circle at 10% 120%,#9f65da61,transparent 65%),linear-gradient(140deg,#261d36,#52337c);box-shadow:0 20px 58px #10061d40;border-color:#70528f}
.hero h1{font-weight:850}.hero p{color:#e2d7eb}.hero .eyebrow{color:#f0d7ff}
.sidebar{background:linear-gradient(180deg,#1d1825,#151219 72%)}
.side-link.active{background:linear-gradient(105deg,#3b2c4d,#30253e);border-color:#65507f}
.topbar{border-bottom:1px solid #322c3b20;margin-bottom:6px}
.page-kicker,.mini-label{letter-spacing:1.1px}
.category-art{transition:transform .2s ease-out,filter .2s ease;isolation:isolate}
.category-card:hover .category-art{transform:translateY(-2px);filter:saturate(1.1)}
.category-card.selected .category-art{box-shadow:inset 0 -4px 0 #bf94fd,0 0 0 2px #a67bea}
.category-label{font-size:12px;color:#dcd7e5}
.place-card{transition:border-color .18s ease,transform .18s ease;min-height:132px;box-shadow:0 12px 35px #05020b23}
.place-card:hover{border-color:#775a9e;transform:translateY(-1px)}
.place-card .place-art{background-color:#392946;background-size:cover;background-position:center}
.place-card .favorite{background:#352940dd;color:#ddcde8;border:1px solid #614e73}
.place-card .favorite.on{color:#ffe3a2;background:#49384b}
.place-card h3{font-weight:820}.post-row:hover strong{color:#e2c9ff}
.chip:hover,.filter-row button:hover{border-color:#8764ad}
.chip.on{background:#7250b3;border-color:#b48ce2}
.primary-btn:active,.secondary-btn:active,.chip:active{transform:translateY(1px)}
.form-input,.form-textarea,.form-select{font-size:16px}
.search-field input{font-size:16px}
.demo-bar{background:linear-gradient(115deg,#34273d,#282134);border-color:#654878}
.demo-bar b{color:#f0d5ff}
.place-section-head{gap:8px;margin:25px 0 6px;flex-wrap:wrap}.place-section-head h2{flex:1;min-width:120px;font-size:19px;letter-spacing:-.7px;margin:0}.place-section-head .chip{padding:8px 12px}.place-section-head .saved-shortcut{background:transparent;border:0;color:#cdb2e9;padding:8px;font-size:12px}
.status-pill.live{background:#244b41;color:#b2ebd5}
@media(max-width:750px){
 body{background:var(--bg)}
 main{padding-top:env(safe-area-inset-top);padding-bottom:calc(118px + env(safe-area-inset-bottom))}
 .topbar{padding:16px 0 20px}
 .circle-icon{min-width:42px;min-height:42px}
 .category-grid{gap:10px}.category-art{height:108px}
 .place-card{min-height:125px}.chip,.bottom-link,.primary-btn,.secondary-btn{min-height:42px}
 .bottom-link{min-height:64px}.bottom-nav{background:#16131bf5}
 .post-row{padding:16px 0}.post-row strong{font-size:15px}
 .hero{grid-template-columns:1fr 68px;min-height:194px;padding:24px 22px}
 .hero-art{font-size:48px}
 .demo-bar{align-items:flex-start}
}
@media(max-width:390px){
 .category-art{height:96px}.category-grid{gap:8px}
 .place-card{grid-template-columns:110px minmax(0,1fr);gap:12px}
 .place-section-head h2{font-size:16px}
 .place-section-head .chip{font-size:11px}
 .offer-banner{padding:21px 18px}
 .category-label{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

</style>
</head>

function icon(name){const paths={home:'<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-13h-7z"/>',chat:'<path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.6-4.2A8.5 8.5 0 1 1 20 11.5z"/>',book:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',map:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',heart:'<path d="M20.8 8.6C20.8 13 12 20 12 20S3.2 13 3.2 8.6a4.5 4.5 0 0 1 8.8-1.2 4.5 4.5 0 0 1 8.8 1.2z"/>',arrow:'<path d="m9 18 6-6-6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="m14 6-6 6 6 6"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19 12 2-1-1-4-2 .5-2-2-1-2h-4l-1 2-2 2-2-.5-1 4 2 1-1 2-1 1 2 4 2-.5 2 2 1 2h4l1-2 2-2 2 .5 1-4-2-1z"/>',check:'<path d="m4 12 5 5L20 6"/>',edit:'<path d="M14 5 19 10M4 20l4-.6L20 7a2 2 0 0 0-3-3L4.7 16.6 4 20z"/>',star:'<path d="m12 2 3.2 6.5 7.2 1-5.2 5.1 1.2 7.1L12 18.4 5.6 21.7l1.2-7.1L1.6 9.5l7.2-1z"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.8" aria-hidden="true">${paths[name]||paths.star}</svg>`;}
const NAV=[['home','실시간현황','bolt'],['daily','데일리톡','chat'],['lounge','라운지','book'],['places','플레이스','map'],['my','마이페이지','user']];
function go(route){location.hash='#'+route;render();window.scrollTo({top:0,behavior:'instant'});}
function route(){let r=decodeURIComponent(location.hash.replace(/^#/,'')||'login');return r.replace(/^\//,'');}
function tabOf(r){if(['home','choice','room'].includes(r.split('/')[0]))return'home';if(r.startsWith('daily'))return'daily';if(['lounge','post','compose'].includes(r.split('/')[0]))return'lounge';if(['places','place','saved'].includes(r.split('/')[0]))return'places';return'my';}
function toast(msg){S.toast=msg;render();setTimeout(()=>{S.toast='';const t=document.getElementById('toast');if(t)t.remove()},3500)}
function notification(text){S.notifications.unshift({id:String(uid()),text,time:'지금',read:false});persist()}
function topbar(r){let t={home:'하이언니',choice:'초이스톡',daily:'데일리톡',lounge:'라운지',places:'플레이스',my:'마이페이지',saved:'저장한 곳',notifications:'알림함',dm:'DM 요청',login:'로그인',signup:'계정 만들기',compose:'새 글 작성'}[r.split('/')[0]]||'하이언니';const general = !['login','signup'].includes(r.split('/')[0]);return `<header class="topbar"><div><div class="mobile-brand"><div class="brand" style="font-size:21px"><span class="brand-mark" style="width:30px;height:30px;border-radius:10px;font-size:20px">h</span>하이언니<span style="font-size:10px;letter-spacing:0;color:#b995e9;margin-left:3px">PREVIEW</span></div></div><div class="desktop-title"><p class="page-kicker">HIUNNI · PRIVATE COMMUNITY</p><h1 class="page-title">${esc(t)}</h1></div></div><div class="top-actions">${general?`<button data-go="saved" class="circle-icon" title="저장한 곳" aria-label="저장한 곳">${icon('heart')}</button><button data-go="notifications" class="circle-icon" title="알림함" aria-label="알림함">${icon('bell')}${S.notifications.some(x=>!x.read)?'<span class="notif-dot"></span>':''}</button>`:''}<button data-go="my" class="circle-icon" title="마이페이지" aria-label="마이페이지">${icon('user')}</button></div></header>`}
function sidebar(r){let active=tabOf(r);return `<aside class="sidebar"><a href="#home" class="brand"><span class="brand-mark">h</span>하이언니</a><div class="brand-small">MIDNIGHT EDITION</div><nav class="nav-stack" aria-label="주요 메뉴">${NAV.map(([x,n,k])=>`<button data-go="${x}" class="side-link ${active===x?'active':''}">${icon(k)}${n}</button>`).join('')}</nav><p class="side-section">QUICK ACCESS</p><div class="nav-stack"><button class="side-link" data-go="choice">${icon('chat')}초이스톡 가게방</button><button class="side-link" data-go="saved">${icon('heart')}저장한 곳</button><button class="side-link" data-go="dm">${icon('send')}익명 DM</button></div><div class="sidebar-spacer"></div><div class="side-foot"><strong>하이언니 데모</strong><p>화면·탐색·저장과 커뮤니티 상호작용을 미리 확인하는 시제품입니다.</p><button data-go="login">시작 화면 보기</button></div></aside>`}
function rightbar(){return `<aside class="rightbar"><div class="page-kicker">PREVIEW DASHBOARD</div><h3>오늘의 하이언니</h3><div class="right-stat"><span class="mini-label">SIMULATED ROOMS</span><div class="num">${INITIAL_ROOMS.length}<span style="font-size:14px;color:#aaa2b9;margin-left:6px;font-weight:500">개 가상 방</span></div><p>실제 운영 접속자 수가 아닌 시연용 카드입니다.</p></div><div class="right-stat"><span class="mini-label">SAVED PLACES</span><div class="num">${S.savedPlaces.length}</div><p>이 브라우저에만 저장된 가상 장소</p></div><div class="section-head"><h2 style="font-size:14px">새 소식</h2></div>${S.notifications.slice(0,3).map(x=>`<div class="right-feed"><span class="dot"></span><div>${esc(x.text)}<small>${esc(x.time)}</small></div></div>`).join('')}<div class="right-promo"><span class="mini-label">DESIGN PREVIEW</span><strong>한밤의 대화도<br>나답게.</strong><p>메인 화면·커뮤니티·플레이스·보관함을 하나의 경험으로 이어 보세요.</p><button class="primary-btn btn-sm" data-go="places">플레이스 탐색 ${icon('arrow')}</button></div></aside>`}
function bottomNav(r){let active=tabOf(r);return `<nav class="bottom-nav" aria-label="하단 메뉴">${NAV.map(([x,n,k])=>`<button data-go="${x}" class="bottom-link ${active===x?'active':''}" aria-label="${n}">${icon(k)}<span>${n}</span></button>`).join('')}</nav>`}
function pageLayout(r,body){return `<div class="app-shell">${sidebar(r)}<main id="main-content"><div class="main-inner page-fade">${topbar(r)}<div class="demo-bar"><span><b>● 데모 전용</b> · 가상 데이터 및 브라우저 로컬 상태입니다. 운영 계정·DB와 연결되지 않습니다.</span><button data-action="reset" title="초기화">초기화</button></div>${body}</div></main>${rightbar()}${bottomNav(r)}</div>${S.toast?`<div id="toast" class="toast" role="status">${esc(S.toast)}</div>`:''}`}
function searchBox(field,placeholder){return `<label class="search-field">${icon('search')}<input data-field="${field}" type="search" autocomplete="off" placeholder="${esc(placeholder)}" value="${esc(S.filters[field])}" aria-label="${esc(placeholder)}"></label>`}
function empty(emoji,title,desc,cta='',url=''){return `<div class="empty"><div class="big">${emoji}</div><strong>${esc(title)}</strong><p>${esc(desc)}</p>${cta?`<button class="secondary-btn btn-sm" data-go="${url}">${esc(cta)}</button>`:''}</div>`}
function home(){return `<section class="hero"><div><div class="eyebrow">A NEW SPACE TO CONNECT</div><h1>오늘의 이야기도,<br>우리답게 이어져요.</h1><p>실시간 소식부터 편안한 수다와 공간 탐색까지.<br>하이언니의 새로운 화면을 만나보세요.</p><button class="primary-btn" data-go="choice">초이스톡 둘러보기 ${icon('arrow')}</button></div><div class="hero-art">🪩</div></section><div class="section-head"><h2>지금 만나볼 공간</h2><button data-go="places">전체 보기 ›</button></div><div class="grid-two"><button class="feature-tile purple" data-go="choice"><strong>초이스톡</strong><small>지역별 가게방과<br>실시간 이야기</small><span class="tile-emoji">🌙</span></button><button class="feature-tile pink" data-go="lounge"><strong>익명 라운지</strong><small>오늘의 고민과<br>서로의 이야기</small><span class="tile-emoji">💬</span></button><button class="feature-tile brown" data-go="places"><strong>플레이스</strong><small>취향에 맞는<br>장소 찾아보기</small><span class="tile-emoji">✨</span></button><button class="feature-tile green" data-go="daily"><strong>데일리톡</strong><small>주제별 채널에서<br>편하게 대화하기</small><span class="tile-emoji">🌿</span></button></div><div class="section-head"><h2>새로운 이야기</h2><button data-go="lounge">모든 글 보기 ›</button></div><div class="post-board">${S.posts.slice(0,3).map(postRow).join('')}</div><div class="section-head"><h2>주목받는 가게방</h2><button data-go="choice">더 보기 ›</button></div><div class="room-list">${INITIAL_ROOMS.slice(0,2).map(roomCard).join('')}</div>`}
function roomCard(x){const active=S.joined.includes(x.id),req=S.requested.includes(x.id);return `<button class="room-card" data-go="room/${x.id}"><div class="room-icon">${x.emoji}</div><div style="flex:1;min-width:0"><h3>${esc(x.name)} ${x.isShop?'<span class="status-pill">가게방</span>':''}</h3><p>${esc(x.desc)}</p><div class="room-meta"><span>${icon('map').replace('width="','width="')} ${esc(x.area)}</span><span>👥 ${x.members}/${x.max}</span><span class="status-pill ${active?'live':''}">${active?'참여 중':req?'승인 대기':x.join==='approval'?'승인형':'바로 참여'}</span></div></div>${icon('arrow')}</button>`}
function choice(){let t=S.filters;let rooms=INITIAL_ROOMS.filter(x=>(t.roomArea==='전체'||x.area===t.roomArea)&&(x.name+' '+x.desc+' '+x.area).toLowerCase().includes(t.roomSearch.toLowerCase()));return `<div class="section-head" style="margin-top:0"><h2>초이스톡 가게방 <span class="status-pill live">LIVE DEMO</span></h2></div>${searchBox('roomSearch','가게명 또는 지역 검색')}<div class="filter-row">${['전체','강남','서울 서부'].map(x=>`<button class="chip ${t.roomArea===x?'on':''}" data-action="room-area" data-value="${x}">${x}</button>`).join('')}</div><div class="count">검색 결과 <b>${rooms.length}</b>개 · 가상 데이터</div><div class="room-list">${rooms.length?rooms.map(roomCard).join(''):empty('🌙','검색된 가게방이 없어요','검색어와 지역 필터를 확인해 주세요.')}</div><div class="hint">가게방은 실제 운영자/회원 계정과 연결되지 않았습니다. 승인 신청·텍스트 대화는 데모 상태로 체험할 수 있습니다.</div>`}
function roomDetail(id){const x=INITIAL_ROOMS.find(x=>x.id===id);if(!x)return empty('🔍','방을 찾지 못했어요','목록에서 다시 선택해 주세요.','목록으로','choice');let joined=S.joined.includes(id),requested=S.requested.includes(id);let msgs=S.chat[id]||[];return `<button class="back-btn" data-go="choice">${icon('back')} 초이스톡으로 돌아가기</button><div class="profile-hero"><div class="avatar">${x.emoji}</div><div><span class="mini-label">${esc(x.area)} · ${x.isShop?'가상 가게방':'커뮤니티 채팅방'}</span><h2>${esc(x.name)}</h2><p>${esc(x.desc)}</p></div></div><div class="grid-two" style="margin:16px 0"><div class="card"><span class="mini-label">MEMBERS</span><h3>${x.members}<span class="muted" style="font-size:13px"> / ${x.max}</span></h3><p class="muted" style="font-size:12px">시연용 가상 참여 수</p></div><div class="card"><span class="mini-label">JOIN TYPE</span><h3>${x.join==='instant'?'바로 참여':'운영자 승인'}</h3><p class="muted" style="font-size:12px">${requested?'승인 대기 중':joined?'참여 중':'신청 가능'}</p></div></div>${x.isShop?`<div class="section-head"><h2>가게방 안내</h2></div><div class="grid-three"><button class="feature-tile purple" data-action="room-info" data-value="가격표"><strong>가격표</strong><small>시연용 안내</small><span class="tile-emoji">💳</span></button><button class="feature-tile pink" data-action="room-info" data-value="용어"><strong>용어</strong><small>가게 이용 가이드</small><span class="tile-emoji">📖</span></button><button class="feature-tile brown" data-go="staff/${id}"><strong>담당 찾기</strong><small>가상 담당 프로필</small><span class="tile-emoji">👩</span></button></div><div class="hint">빈방 현황: ${x.vacancy||0}개 (가상 샘플)</div>`:''}<div class="section-head"><h2>대화</h2><span class="status-pill">데모 메시지</span></div><div class="chat-bubbles">${msgs.map(m=>`<div class="bubble ${m.mine?'mine':''}"><div class="bubble-name">${esc(m.name)}</div>${esc(m.body)}</div>`).join('')||empty('💬','아직 메시지가 없어요','이 방의 첫 이야기를 남겨 보세요.')}</div>${joined?`<form class="message-compose" data-form="chat" data-id="${id}"><input name="body" maxlength="500" placeholder="메시지를 입력해 주세요" aria-label="메시지"><button type="submit">보내기</button></form><div style="margin-top:17px"><button class="ghost-btn" data-action="leave-room" data-value="${id}">이 방 나가기</button></div>`:requested?`<div class="hint">승인 요청이 보관되었습니다. 운영자 승인은 실제로 이루어지지 않습니다. <button class="linkish" data-action="cancel-room" data-value="${id}">요청 취소</button></div>`:`<button class="primary-btn" data-action="join-room" data-value="${id}">${x.join==='approval'?'참여 승인 신청':'지금 참여하기'}</button>`}`}
function staff(id){let x=INITIAL_ROOMS.find(x=>x.id===id);if(!x||!x.isShop)return empty('🔍','담당 정보가 없어요','가게방을 먼저 선택해 주세요.','초이스톡','choice');return `<button class="back-btn" data-go="room/${id}">${icon('back')} 가게방으로</button><div class="section-head" style="margin-top:0"><h2>${esc(x.name)} · 담당 찾기</h2></div><div class="hint">가상 담당자 정보입니다. 실제 연락처·접속상태·예약정보가 아닙니다.</div>${x.staff.map((n,i)=>`<div class="room-card" style="margin:10px 0"><div class="room-icon">${i===0?'👩':'🌷'}</div><div style="flex:1"><h3>${esc(n)}</h3><p>담당자 프로필 · 시연 정보</p></div><button class="secondary-btn btn-sm" data-action="request-dm" data-value="${esc(n)}">DM 신청</button></div>`).join('')}`}
function daily(){let rooms=[{id:'d1',title:'미드나잇 데일리톡',sub:'하루의 안부를 나누는 이야기 채널',members:17,emoji:'🌙'},{id:'d2',title:'뷰티 정보방',sub:'관리 팁과 취향을 공유하는 채팅방',members:24,emoji:'💄'},{id:'d3',title:'자유 홍보방',sub:'규칙을 지키며 서로의 소식을 알려요',members:9,emoji:'📣'}];return `<div class="section-head" style="margin-top:0"><h2>우리끼리 매일, 데일리톡</h2></div><div class="offer-banner"><span class="mini-label" style="color:#eed5ff">TOPIC CONVERSATIONS</span><strong>매일의 순간을 나눠요.</strong><p>수다·뷰티·일상을 위한 가상 주제방</p></div><div class="room-list">${rooms.map(x=>`<button class="room-card" data-go="daily/${x.id}"><div class="room-icon">${x.emoji}</div><div style="flex:1"><h3>${esc(x.title)}</h3><p>${esc(x.sub)}</p><div class="room-meta"><span>${x.members}명 · 시연 인원</span><span class="status-pill">대화 열기</span></div></div>${icon('arrow')}</button>`).join('')}</div><div class="hint">데일리톡은 주제별 채팅방, 라운지는 게시판으로 구분했습니다.</div>`}
function dailyDetail(id){let idx={d1:['미드나잇 데일리톡','🌙'],d2:['뷰티 정보방','💄'],d3:['자유 홍보방','📣']}[id];if(!idx)return empty('🔍','채팅방을 찾지 못했어요','데일리톡 목록으로 돌아가 주세요.','데일리톡','daily');let key='daily_'+id;let msgs=S.chat[key]||[{id:'d0',name:'운영 데모',body:'가상 채팅방입니다. 편하게 인사를 남겨 보세요.',mine:false}];return `<button class="back-btn" data-go="daily">${icon('back')} 데일리톡으로</button><div class="profile-hero"><div class="avatar">${idx[1]}</div><div><h2>${esc(idx[0])}</h2><p>데모용 주제별 대화 공간</p></div></div><div class="chat-bubbles">${msgs.map(m=>`<div class="bubble ${m.mine?'mine':''}"><div class="bubble-name">${esc(m.name)}</div>${esc(m.body)}</div>`).join('')}</div><form class="message-compose" data-form="chat" data-id="${key}"><input name="body" placeholder="데모 메시지를 입력해 주세요" maxlength="500" aria-label="메시지"><button type="submit">보내기</button></form>`}
function postRow(x){return `<button class="post-row" data-go="post/${x.id}"><strong>${esc(x.title)} <span style="color:#bd9ae2">[${x.comments.length}]</span></strong><span class="text-preview">${esc(x.body)}</span><div class="meta"><span>${esc(x.category)}</span><span>${esc(x.author)}</span><span>♡ ${x.likes}</span><span>조회 ${x.views}</span><span>${esc(x.created)}</span></div></button>`}
function lounge(){let t=S.filters;const categories=['전체','자유 수다','동행 찾기','정보·이슈','나눔·거래','홍보·구인','질문'];let posts=S.posts.filter(x=>(t.postCategory==='전체'||x.category===t.postCategory)&&(x.title+' '+x.body).toLowerCase().includes(t.postSearch.toLowerCase()));if(t.postSort==='popular')posts.sort((a,b)=>b.likes-a.likes);return `<div class="section-head" style="margin-top:0"><h2>익명 라운지</h2><span class="status-pill">편안한 커뮤니티</span></div><div class="grid-three" style="margin-bottom:16px">${categories.slice(1).map((c,i)=>`<button class="feature-tile ${['purple','pink','brown','green','purple','pink'][i]}" style="min-height:94px;padding:15px" data-action="post-category" data-value="${c}"><strong style="font-size:14px">${esc(c)}</strong><small>${['일상 공유','함께 하는 시간','생활 이야기','필요한 물건','소식 공유','궁금한 점'][i]}</small></button>`).join('')}</div>${searchBox('postSearch','게시글 검색')}<div class="filter-row">${categories.map(c=>`<button class="chip ${t.postCategory===c?'on':''}" data-action="post-category" data-value="${c}">${esc(c)}</button>`).join('')}</div><div class="floating-stack"><span class="count">게시글 <b>${posts.length}</b>건</span><div class="filter-row" style="padding:4px 0"><button class="chip ${t.postSort==='new'?'on':''}" data-action="post-sort" data-value="new">최신순</button><button class="chip ${t.postSort==='popular'?'on':''}" data-action="post-sort" data-value="popular">인기순</button></div></div><div class="post-board"><div class="notice-row">📌 하이언니 데모 게시판 이용 안내 · 실제 회원 글이 아닙니다</div>${posts.length?posts.map(postRow).join(''):empty('📜','검색된 게시글이 없어요','검색어를 바꾸거나 다른 게시판을 선택해 주세요.')}</div><button class="compose-fab" data-go="compose" aria-label="새 글 작성" title="새 글 작성">${icon('edit')}</button>`}
function postDetail(id){let p=S.posts.find(x=>String(x.id)===id);if(!p)return empty('🔍','게시글이 없어요','라운지에서 다른 글을 선택해 주세요.','라운지','lounge');const liked=S.liked.includes(id);return `<button class="back-btn" data-go="lounge">${icon('back')} 라운지로</button><div class="card" style="padding:23px"><span class="tag">${esc(p.category)}</span><h2 style="font-size:22px;line-height:1.4;letter-spacing:-.7px;margin:18px 0 12px">${esc(p.title)}</h2><div class="room-meta"><span>${esc(p.author)}</span><span>${esc(p.created)}</span><span>조회 ${p.views}</span></div><div class="divider"></div><p style="white-space:pre-wrap;line-height:1.85;font-size:14px;min-height:120px">${esc(p.body)}</p><div class="divider"></div><div class="floating-stack"><button class="secondary-btn btn-sm" data-action="like" data-value="${id}">${liked?'♥':'♡'} 공감 ${p.likes}</button><button class="ghost-btn" data-action="request-dm" data-value="${esc(p.author)}">익명 DM 신청</button><button class="ghost-btn" data-action="report" data-value="${id}">신고</button></div></div><div class="section-head"><h2>댓글 ${p.comments.length}</h2></div>${p.comments.length?p.comments.map(c=>`<div class="reply-card ${c.secret?'secret':''}"><small>${esc(c.name)} ${c.secret?'· 🔒 비밀댓글 (데모)':''}</small><p>${esc(c.body)}</p></div>`).join(''):empty('💭','아직 댓글이 없어요','첫 댓글을 남겨 보세요.')}<form data-form="comment" data-id="${id}" class="card"><div class="form-group"><label>댓글 작성</label><textarea class="form-textarea" name="body" maxlength="500" placeholder="따뜻한 말을 남겨 주세요"></textarea></div><label class="form-check"><input type="checkbox" name="secret"> 비밀댓글 (로컬 데모 · 서버 접근제어 미적용)</label><button class="primary-btn" type="submit">댓글 등록</button></form>`}
function compose(){return `<button class="back-btn" data-go="lounge">${icon('back')} 라운지로</button><div class="form-panel"><h1>새 글 작성</h1><p>글은 이 브라우저의 샘플 데이터에만 저장되며 운영 서비스에 전송되지 않습니다.</p><form data-form="post"><div class="form-group"><label for="category">게시판 선택</label><select id="category" class="form-select" name="category"><option>자유 수다</option><option>동행 찾기</option><option>정보·이슈</option><option>나눔·거래</option><option>홍보·구인</option><option>질문</option></select></div><div class="form-group"><label for="title">제목</label><input id="title" class="form-input" name="title" required minlength="2" maxlength="80" placeholder="제목을 입력해 주세요"></div><div class="form-group"><label for="body">내용</label><textarea id="body" class="form-textarea" name="body" required minlength="2" maxlength="2000" placeholder="서로를 존중하는 마음으로 작성해 주세요"></textarea></div><button class="primary-btn" type="submit">게시글 등록</button></form></div>`}
function places(){let t=S.filters;let places=INITIAL_PLACES.filter(x=>(t.category==='전체'||t.category===x.category)&&(t.area==='전체'||x.area===t.area)&&(t.placeType==='all'||(t.placeType==='night'&&x.night)||(t.placeType==='weekend'&&x.weekend))&&(x.name+' '+x.desc+' '+x.area).toLowerCase().includes(t.placeSearch.toLowerCase()));return `<div class="pill-tabs"><button data-go="home"># 실시간현황</button><button class="on"># 플레이스</button><button data-go="daily"># 데일리톡</button></div><div class="offer-banner"><span class="mini-label" style="color:#e8d4ff">HIUNNI PLACES</span><strong>하이언니 플레이스</strong><p>나만의 스타일과 공간을 발견하는 밤</p></div><button class="menu-row" style="margin-bottom:21px" data-action="guide"><span>📣 플레이스 이용 가이드</span>${icon('arrow')}</button>${searchBox('placeSearch','지역·가게명·키워드 검색')}<div class="category-grid">${CATEGORIES.map(c=>`<button class="category-card ${t.category===c.id?'selected':''}" data-action="place-category" data-value="${c.id}"><div class="category-art" style="--c1:${c.c1};--c2:${c.c2};background-image:linear-gradient(0deg,rgba(12,9,19,.7),transparent 68%),url(${CATEGORY_PHOTOS[c.id]})"><b>${esc(c.label)}</b><span class="category-emoji">${c.emoji}</span></div><div class="category-label">${esc(c.short)}</div></button>`).join('')}</div><div class="floating-stack place-section-head"><h2>${t.category==='전체'?'추천 플레이스':esc(t.category)}</h2><button class="chip ${t.category==='전체'?'on':''}" data-action="place-category" data-value="전체">전체 보기</button><button class="saved-shortcut" data-go="saved">저장한 곳 (${S.savedPlaces.length})</button></div><div class="pill-tabs"><button class="${t.placeType==='all'?'on':''}" data-action="place-type" data-value="all">추천 공간</button><button class="${t.placeType==='night'?'on':''}" data-action="place-type" data-value="night">심야·24시</button><button class="${t.placeType==='weekend'?'on':''}" data-action="place-type" data-value="weekend">주말 영업</button></div><div class="filter-row">${['전체','강남','성수','홍대','서울 외'].map(a=>`<button data-action="place-area" data-value="${a}" class="chip ${t.area===a?'on':''}">${a}</button>`).join('')}</div><div class="count">조건에 맞는 시연 장소 <b>${places.length}</b>개</div><div class="place-list">${places.length?places.map(placeCard).join(''):empty('🪻','조건에 맞는 장소가 없어요','다른 카테고리·지역·영업 조건을 골라 보세요.')}</div>`}
function placeCard(x){let yes=S.savedPlaces.includes(x.id);return `<div class="place-card"><button class="place-art" data-go="place/${x.id}" style="border:0;--c1:${x.c1};--c2:${x.c2};background-image:linear-gradient(0deg,rgba(12,9,19,.08),rgba(12,9,19,.06)),url(${CATEGORY_PHOTOS[x.category]})" aria-label="${esc(x.name)} 상세 보기"></button><button class="favorite ${yes?'on':''}" data-action="favorite" data-value="${x.id}" title="${yes?'저장 해제':'저장'}" aria-label="${yes?'저장 해제':'저장'}">${yes?'★':'☆'}</button><div><button data-go="place/${x.id}" style="background:none;border:none;text-align:left;padding:0"><h3>${esc(x.name)}</h3></button><p>${esc(x.desc)}</p><div class="room-meta"><span>📍 ${esc(x.area)}</span><span>${esc(x.category)}</span></div><div class="place-extra" style="margin-top:7px">${x.night?'🌙 심야 ':''}${x.weekend?' · 주말영업 ':''} ${x.verified?' · 정보 확인 예시':''}</div></div></div>`}
function placeDetail(id){let x=INITIAL_PLACES.find(x=>x.id===id);if(!x)return empty('🔍','장소를 찾지 못했어요','플레이스 목록을 확인해 주세요.','플레이스','places');let yes=S.savedPlaces.includes(id);return `<button class="back-btn" data-go="places">${icon('back')} 플레이스로</button><div style="border-radius:21px;height:230px;background:linear-gradient(0deg,rgba(14,9,19,.22),rgba(14,9,19,.04)),url(${CATEGORY_PHOTOS[x.category]});background-size:cover;background-position:center;display:grid;place-items:center;font-size:88px;margin:0 0 20px"></div><div class="floating-stack"><span class="tag">${esc(x.category)}</span><button class="secondary-btn btn-sm" data-action="favorite" data-value="${id}">${yes?'★ 저장됨':'☆ 저장하기'}</button></div><h1 style="letter-spacing:-1px;margin:15px 0 8px">${esc(x.name)}</h1><p class="muted" style="font-size:13px;line-height:1.8">${esc(x.desc)}</p><div class="divider"></div><div class="profile-data"><b>지역</b><p>${esc(x.area)}</p></div><div class="profile-data"><b>영업 안내</b><p>${x.night?'심야 · 24시 필터 대상 (샘플)':'기본 운영 시간 (샘플)'}${x.weekend?' · 주말 운영':''}</p></div><div class="profile-data"><b>주소</b><p>시연용 가상 공간 · 실제 주소가 없습니다.</p></div><div class="hint">사진·영업시간·주소 정보는 시연용입니다. 운영 API나 업체 검증 자료가 아닙니다.</div><button class="secondary-btn" data-action="report" data-value="${id}">정보 오류 신고 (데모)</button>`}
function saved(){let places=INITIAL_PLACES.filter(p=>S.savedPlaces.includes(p.id));return `<button class="back-btn" data-go="places">${icon('back')} 플레이스로</button><div class="section-head" style="margin-top:0"><h2>저장한 곳</h2><span class="tag">${places.length}곳</span></div><p class="muted" style="font-size:13px;line-height:1.7">저장한 장소는 이 브라우저의 데모 보관함에 남아요.</p><div class="place-list">${places.length?places.map(placeCard).join(''):empty('☆','아직 저장한 곳이 없어요','플레이스에서 별표를 눌러 장소를 저장해 보세요.','플레이스 둘러보기','places')}</div>`}
function my(){return `<div class="profile-hero"><div class="avatar">${S.demo?'🌷':'👤'}</div><div><span class="mini-label">${S.demo?'SAMPLE USER':'GUEST MODE'}</span><h2>${S.demo?esc(S.alias):'로그인하지 않았어요'}</h2><p>${S.demo?'로컬 데모 체험 중 · 운영 계정 아님':'계정 없이 화면을 둘러볼 수 있어요'}</p></div></div>${!S.demo?`<div class="hint">아직 로그인하지 않았어요. 데모 입장으로 주요 기능을 체험해 보세요.</div><button class="primary-btn" data-go="login">시작 화면 열기</button>`:''}<div class="section-head"><h2>나의 활동</h2></div><div class="grid-two"><button class="feature-tile purple" data-go="saved"><strong>저장한 곳</strong><small>${S.savedPlaces.length}곳의 가상 장소</small><span class="tile-emoji">☆</span></button><button class="feature-tile pink" data-go="dm"><strong>익명 DM</strong><small>${S.dmRequests.filter(x=>x.status==='pending').length}개의 요청 대기</small><span class="tile-emoji">✉️</span></button></div><div class="section-head"><h2>계정 및 서비스</h2></div><div class="menu-list"><button data-go="notifications" class="menu-row">알림함 <span>${S.notifications.filter(x=>!x.read).length}개 미확인 ›</span></button><button data-go="saved" class="menu-row">저장한 플레이스 <span>전체 보기 ›</span></button><button data-go="choice" class="menu-row">참여한 방 <span>${S.joined.length}개 ›</span></button><button data-action="guide" class="menu-row">앱 이용 가이드 <span>열기 ›</span></button><button data-action="reset" class="menu-row">데모 데이터 초기화 <span>초기화 ›</span></button>${S.demo?`<button data-action="logout" class="menu-row">데모 종료 <span>로그아웃 ›</span></button>`:''}</div><div class="hint">본인인증·실제 계정·서버 저장·OS 푸시는 아직 연결되지 않았습니다. 화면은 구현된 반응형 웹 데모입니다.</div>`}
function dms(){let req=S.dmRequests;return `<div class="section-head" style="margin-top:0"><h2>익명 DM 요청</h2></div><div class="hint">상대의 수락 없이 DM을 시작할 수 없도록 데모 상태를 구성했습니다. 실제 보안 검증·서버 차단 규칙은 별도입니다.</div>${req.map(x=>`<div class="card" style="margin:11px 0"><div class="floating-stack"><strong>${esc(x.from)}</strong><span class="tag">${x.status==='pending'?'수락 대기':x.status==='accepted'?'수락됨':'거절됨'}</span></div><p class="muted" style="font-size:12px">${esc(x.source||'익명 커뮤니티')} · 시연 요청</p>${x.status==='pending'?`<div class="form-row"><button class="primary-btn btn-sm" data-action="dm-accept" data-value="${x.id}">수락</button><button class="secondary-btn btn-sm" data-action="dm-reject" data-value="${x.id}">거절</button></div>`:x.status==='accepted'?`<button class="secondary-btn btn-sm" data-go="messages/${x.id}">대화 열기</button>`:''}</div>`).join('')}${req.length===0?empty('💌','DM 요청이 없어요','라운지에서 작성자에게 대화를 신청해 보세요.','라운지 가기','lounge'):''}`}
function messages(id){const x=S.dmRequests.find(x=>x.id===id);if(!x||x.status!=='accepted')return empty('🔒','대화를 열 수 없어요','수락된 요청만 대화로 연결됩니다.','DM 요청','dm');let msgs=S.dms.filter(y=>y.dmId===id);return `<button class="back-btn" data-go="dm">${icon('back')} DM 목록으로</button><div class="profile-hero"><div class="avatar">✉️</div><div><h2>${esc(x.from)}</h2><p>수락형 익명 대화 · 로컬 데모</p></div></div><div class="chat-bubbles">${msgs.map(y=>`<div class="bubble ${y.mine?'mine':''}"><div class="bubble-name">${y.mine?'나':esc(x.from)}</div>${esc(y.body)}</div>`).join('')||'<div class="hint">첫 메시지를 남겨 보세요.</div>'}</div><form class="message-compose" data-form="dm-message" data-id="${id}"><input name="body" maxlength="500" required placeholder="메시지를 입력하세요" aria-label="DM 메시지"><button type="submit">보내기</button></form><div style="margin-top:18px"><button class="ghost-btn" data-action="block" data-value="${esc(x.from)}">차단 (데모)</button><button class="ghost-btn" data-action="report" data-value="${esc(x.from)}">신고</button></div>`}
function notifications(){return `<div class="section-head" style="margin-top:0"><h2>알림함</h2><button data-action="mark-read">모두 읽음</button></div>${S.notifications.map(x=>`<div class="card" style="margin:10px 0;opacity:${x.read?'.75':'1'}"><div class="floating-stack"><strong style="font-size:13px">${esc(x.text)}</strong><span class="status-pill">${x.read?'확인':'NEW'}</span></div><p class="muted" style="font-size:11px;margin-bottom:0">${esc(x.time)} · 로컬 알림</p></div>`).join('')}`}
function login(){return `<div class="auth-wrap"><div class="auth-logo"><div class="brand"><span class="brand-mark">h</span>하이언니</div><p>새로운 커뮤니티 경험을 미리 살펴보세요.</p></div><div class="form-panel"><span class="mini-label">WELCOME TO HIUNNI</span><h1 style="margin-top:13px">다시 만나 반가워요.</h1><p>편안한 연결, 나다운 이야기. 하이언니 미드나잇 웹 데모입니다.</p><div class="hint">현재 실제 인증 서버와 연결되지 않았습니다. <b>실제 계정 정보나 비밀번호를 입력하지 마세요.</b> 아래 버튼으로 샘플 계정 체험을 시작하세요.</div><button class="primary-btn" style="width:100%;padding:15px" data-action="enter-demo">샘플 계정으로 체험하기 ${icon('arrow')}</button><div class="divider"></div><div class="form-group"><label>운영 계정 로그인 (연동 전)</label><input class="form-input" placeholder="실제 계정 입력은 현재 지원하지 않습니다" disabled></div><button class="secondary-btn" style="width:100%" disabled>운영 로그인 미연결</button><p class="center" style="margin:20px 0 0">처음이신가요? <button class="linkish" data-go="signup">계정 만들기 미리보기</button></p></div></div>`}
function signup(){return `<div class="auth-wrap"><div class="auth-logo"><div class="brand"><span class="brand-mark">h</span>하이언니</div><p>나만의 데모 프로필을 만들어 보세요.</p></div><div class="form-panel"><h1>계정 만들기 미리보기</h1><p>운영 회원가입이 아니라 <b>로컬 샘플 프로필 생성</b>입니다. 비밀번호·연락처는 받거나 저장하지 않습니다.</p><form data-form="signup"><div class="form-group"><label for="alias">데모 닉네임</label><input id="alias" class="form-input" name="alias" minlength="2" maxlength="16" required placeholder="예: 봄날언니"></div><label class="form-check"><input type="checkbox" name="agree" required> 이 화면이 운영 회원가입이 아닌 데모임을 확인했습니다.</label><button class="primary-btn" style="width:100%" type="submit">데모 프로필 만들기</button></form><p class="center"><button class="linkish" data-go="login">로그인 화면으로</button></p></div></div>`}
function notFound(){return empty('🪄','요청한 화면을 찾지 못했어요','메인 화면으로 돌아갈 수 있습니다.','홈으로','home')}
function render(opts={}){let r=route();let base=r.split('/')[0];let id=r.split('/')[1]||'';let body;switch(base){case'home':body=home();break;case'choice':body=choice();break;case'room':body=roomDetail(id);break;case'staff':body=staff(id);break;case'daily':body=id?dailyDetail(id):daily();break;case'lounge':body=lounge();break;case'post':body=postDetail(id);break;case'compose':body=compose();break;case'places':body=places();break;case'place':body=placeDetail(id);break;case'saved':body=saved();break;case'my':body=my();break;case'dm':body=dms();break;case'messages':body=messages(id);break;case'notifications':body=notifications();break;case'login':body=login();break;case'signup':body=signup();break;default:body=notFound()}
  root.innerHTML=pageLayout(r,body);document.title=`하이언니 · ${base==='login'?'시작하기':base==='home'?'홈':base} | UI/UX Demo`;
  if(opts.focusField){let f=document.querySelector(`[data-field="${opts.focusField}"]`);if(f){f.focus({preventScroll:true});let p=opts.selection??f.value.length;try{f.setSelectionRange(p,p)}catch(e){}}}
}
function click(e){const el=e.target.closest('[data-go],[data-action]');if(!el)return;if(el.dataset.go){e.preventDefault();go(el.dataset.go);return}const action=el.dataset.action,v=el.dataset.value||'';if(!action)return;e.preventDefault();switch(action){
 case'enter-demo':S.demo=true;notification('샘플 계정으로 데모 모드가 시작되었습니다.');persist();go('home');break;
 case'favorite':if(S.savedPlaces.includes(v)){S.savedPlaces=S.savedPlaces.filter(x=>x!==v);persist();toast('저장을 해제했습니다')}else{S.savedPlaces.push(v);persist();toast('저장한 곳에 추가했습니다')}break;
 case'place-category':S.filters.category=v;S.filters.area='전체';S.filters.placeType='all';persist();render();break;
 case'place-type':S.filters.placeType=v;persist();render();break;
 case'place-area':S.filters.area=v;persist();render();break;
 case'room-area':S.filters.roomArea=v;persist();render();break;
 case'post-category':S.filters.postCategory=v;persist();render();break;
 case'post-sort':S.filters.postSort=v;persist();render();break;
 case'join-room':{const x=INITIAL_ROOMS.find(r=>r.id===v);if(!x)return;if(x.join==='approval'){if(!S.requested.includes(v))S.requested.push(v);notification(`${x.name} 참여 신청을 데모에 기록했습니다.`);persist();toast('승인 신청 상태로 표시했습니다. 실제 운영 승인 아님.')}else{if(!S.joined.includes(v))S.joined.push(v);persist();toast('가상 채팅방에 입장했습니다.')}break}
 case'cancel-room':S.requested=S.requested.filter(x=>x!==v);persist();toast('참여 신청을 취소했습니다');break;
 case'leave-room':S.joined=S.joined.filter(x=>x!==v);persist();toast('가상 채팅방에서 나왔습니다');break;
 case'like':{let p=S.posts.find(x=>String(x.id)===v);if(!p)break;if(S.liked.includes(v)){S.liked=S.liked.filter(x=>x!==v);p.likes=Math.max(0,p.likes-1)}else{S.liked.push(v);p.likes++}persist();render();break}
 case'request-dm':{if(v==='운영 데모'){toast('운영 데모 계정에는 DM을 신청할 수 없습니다');break}let existing=S.dmRequests.find(x=>x.from===v);if(existing){toast('이미 DM 요청 기록이 있습니다');break}S.dmRequests.push({id:'d'+uid(),from:v,status:'pending',source:'가게방·게시글에서 요청'});notification(`${v} 님에 대한 수락형 DM 요청을 만들었습니다.`);persist();toast('DM 수락 요청을 생성했습니다');break}
 case'dm-accept':{let x=S.dmRequests.find(x=>x.id===v);if(x){x.status='accepted';notification(`${x.from} 님과 데모 대화를 시작할 수 있습니다.`);persist();go('messages/'+v)}break}
 case'dm-reject':{let x=S.dmRequests.find(x=>x.id===v);if(x){x.status='rejected';persist();toast('요청을 거절했습니다')}break}
 case'report':toast('신고 접수 UI 데모입니다. 실제 서버 신고는 연결되지 않았습니다.');break;
 case'block':S.blocked.push(v);persist();toast('차단 기록을 데모에 표시했습니다. 서버 차단 미구현.');break;
 case'room-info':toast(v+'는 데모 안내입니다. 실제 운영 정보를 확인해 주세요.');break;
 case'guide':toast('모든 화면은 합성 샘플 데이터로 구성됐습니다. 실제 정보/운영 이용 불가.');break;
 case'mark-read':S.notifications.forEach(x=>x.read=true);persist();toast('모든 알림을 읽음 처리했습니다');break;
 case'logout':S.demo=false;persist();go('login');break;
 case'reset':if(confirm('이 브라우저의 가상 데모 데이터를 초기화할까요?')){try{localStorage.removeItem(STATE_KEY)}catch(e){}location.hash='#login';location.reload()}break;
 }
}
function submit(e){let f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();let fd=new FormData(f);let form=f.dataset.form,id=f.dataset.id||'';let body=(fd.get('body')||'').toString().trim();if(form==='chat'){if(body.length<1){toast('메시지를 입력해 주세요');return}if(!S.chat[id])S.chat[id]=[];S.chat[id].push({id:String(uid()),name:S.alias,body:body.slice(0,500),mine:true});persist();render();return}
 if(form==='dm-message'){let x=S.dmRequests.find(x=>x.id===id);if(!x||x.status!=='accepted'){toast('수락된 요청에서만 메시지를 보낼 수 있습니다');return}if(!body)return;S.dms.push({id:String(uid()),dmId:id,body:body.slice(0,500),mine:true});persist();render();return}
 if(form==='comment'){let p=S.posts.find(x=>String(x.id)===id);if(!p||body.length<1){toast('댓글을 입력해 주세요');return}p.comments.push({id:'c'+uid(),name:S.alias,body:body.slice(0,500),secret:fd.get('secret')==='on'});persist();toast('댓글이 로컬 데모에 저장되었습니다');return}
 if(form==='post'){let title=(fd.get('title')||'').toString().trim();if(title.length<2||body.length<2){toast('제목과 내용을 2글자 이상 입력해 주세요');return}let p={id:'b'+uid(),title:title.slice(0,80),body:body.slice(0,2000),category:(fd.get('category')||'자유 수다').toString(),author:S.alias,likes:0,views:0,comments:[],created:'지금'};S.posts.unshift(p);persist();go('post/'+p.id);return}
 if(form==='signup'){let alias=(fd.get('alias')||'').toString().trim();if(alias.length<2||!fd.has('agree')){toast('닉네임과 데모 안내 확인이 필요합니다');return}S.alias=alias.slice(0,16);S.demo=true;notification(`${S.alias} 데모 프로필이 생성되었습니다. 실제 계정이 아닙니다.`);persist();go('home');return}
}
root.addEventListener('click',click);
root.addEventListener('submit',submit);
root.addEventListener('input',e=>{let el=e.target;if(el.dataset.field){let field=el.dataset.field;let sel=el.selectionStart;S.filters[field]=el.value;persist();render({focusField:field,selection:sel})}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});
render();
})();

</script>
</body>
</html>

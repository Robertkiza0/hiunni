apply plugin: 'com.android.application'

// Release signing comes only from the build environment (same variables as the previous TWA build).
// The store already has app.hiunni.mobile signed with the approved upload key, so use that key.
def releaseKeys = ['HIUNNI_KEYSTORE', 'HIUNNI_KEYSTORE_PASSWORD', 'HIUNNI_KEY_ALIAS', 'HIUNNI_KEY_PASSWORD']
def releaseValues = releaseKeys.collectEntries { key -> [(key): System.getenv(key)] }
def hasReleaseSigning = releaseValues.values().every { it != null && !it.isBlank() }

android {
    namespace = "app.hiunni.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.hiunni.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseValues.HIUNNI_KEYSTORE)
                storePassword releaseValues.HIUNNI_KEYSTORE_PASSWORD
                keyAlias releaseValues.HIUNNI_KEY_ALIAS
                keyPassword releaseValues.HIUNNI_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Refuse to build an unsigned or debug-signed store release.
def releaseSigningCheck = tasks.register('checkReleaseSigning') {
    doLast {
        def missing = releaseKeys.findAll { !releaseValues[it] || releaseValues[it].isBlank() }
        if (!missing.isEmpty()) throw new GradleException('Release signing is not configured. Supply: ' + missing.join(', ') + '. Use assembleDebug for device testing.')
        if (!file(releaseValues.HIUNNI_KEYSTORE).isFile()) throw new GradleException('The release keystore file is unavailable.')
        if (releaseValues.HIUNNI_KEY_ALIAS.equalsIgnoreCase('androiddebugkey')) throw new GradleException('A debug signing key must not be used for a store release.')
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'validateSigningRelease') task.dependsOn(releaseSigningCheck)
}
